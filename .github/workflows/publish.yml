name: publish

# Trusted Publishing (OIDC): no API tokens or passwords are stored anywhere.
# - Run manually ("Run workflow") to upload the current main to TestPyPI only.
# - Publishing a GitHub release uploads to TestPyPI first, then to PyPI.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::pyproject.toml version v$version does not match the release tag $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Make README links absolute for the PyPI page
        run: python .github/scripts/pypi_readme.py README.md "${{ github.event_name == 'release' && github.ref_name || github.sha }}"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import quantumlab, quantumlab.stationary, quantumlab.solvers.split_operator; print('quantumlab', quantumlab.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/quantumlab
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # a manual test run may already have uploaded this version
          skip-existing: true

  pypi:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quantumlab
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
